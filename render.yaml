# Free preview: no persistent disk and no payment credentials.
services:
  - type: web
    name: neatquote-preview
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: NODE_VERSION
        value: "24.19.0"
      - key: DATA_DIR
        value: /tmp/neatquote-preview
      - key: TRUST_PROXY
        value: "1"
      - key: NEATQUOTE_PREVIEW
        value: "1"
